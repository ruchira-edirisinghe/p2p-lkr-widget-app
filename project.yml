name: P2PMonitor
options:
  bundleIdPrefix: dev.dfanso
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: UN798LFFKG
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  P2PKit:
    path: P2PKit
targets:
  P2PMonitor:
    type: application
    platform: macOS
    sources: [P2PMonitor]
    dependencies:
      - package: P2PKit
      - target: P2PWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dfanso.p2pmonitor
        CODE_SIGN_ENTITLEMENTS: P2PMonitor/P2PMonitor.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
  P2PWidget:
    type: app-extension
    platform: macOS
    sources: [P2PWidget]
    dependencies:
      - package: P2PKit
    info:
      path: P2PWidget/Info.plist
      properties:
        CFBundleDisplayName: USDT/LKR Rate
        # Must match the host app or ValidateEmbeddedBinary warns.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dfanso.p2pmonitor.widget
        CODE_SIGN_ENTITLEMENTS: P2PWidget/P2PWidget.entitlements
